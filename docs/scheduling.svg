<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <defs>
    <style>
      .box { fill: #f6f7f9; stroke: #2d2f33; stroke-width: 2; rx: 8; }
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #1e1f22; }
      .text { font-family: Arial, sans-serif; font-size: 13px; fill: #1e1f22; }
      .arrow { stroke: #2d2f33; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke-dasharray: 6 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d2f33" />
    </marker>
  </defs>

  <!-- Left column: Sources and Engine -->
  <rect class="box" x="40" y="60" width="260" height="90" />
  <text class="title" x="60" y="95">ReplaySource</text>
  <text class="text" x="60" y="118">TardisIncrementalBookL2CsvReplay</text>

  <rect class="box" x="40" y="200" width="260" height="110" />
  <text class="title" x="60" y="235">ReplayEngine</text>
  <text class="text" x="60" y="258">step(): next() + publish(Event)</text>
  <text class="text" x="60" y="278">current_time(): last receive_time</text>

  <rect class="box" x="40" y="360" width="260" height="80" />
  <text class="title" x="60" y="395">DeterministicClock</text>
  <text class="text" x="60" y="418">set(receive_time)</text>

  <!-- Middle: Event bus and sinks -->
  <rect class="box" x="370" y="200" width="220" height="90" />
  <text class="title" x="390" y="235">EventBus</text>
  <text class="text" x="390" y="258">publish(Event)</text>

  <rect class="box" x="660" y="170" width="260" height="120" />
  <text class="title" x="680" y="205">OrderBookSink</text>
  <text class="text" x="680" y="228">SequenceGuard.accept()</text>
  <text class="text" x="680" y="248">apply_update(bid/ask)</text>
  <text class="text" x="680" y="268">snapshot resets book</text>

  <rect class="box" x="660" y="330" width="260" height="110" />
  <text class="title" x="680" y="365">OrderBookL2</text>
  <text class="text" x="680" y="388">best_bid / best_ask</text>
  <text class="text" x="680" y="408">depth_bid / depth_ask</text>
  <text class="text" x="680" y="428">imbalance()</text>

  <!-- Right: Strategy/Backtest loop -->
  <rect class="box" x="950" y="170" width="210" height="160" />
  <text class="title" x="970" y="205">Decision Loop</text>
  <text class="text" x="970" y="228">interval = 100ms</text>
  <text class="text" x="970" y="248">min hold = 500ms</text>
  <text class="text" x="970" y="268">confirm = 3</text>
  <text class="text" x="970" y="288">signal from depth imbalance</text>

  <rect class="box" x="950" y="370" width="210" height="110" />
  <text class="title" x="970" y="405">PnL & Metrics</text>
  <text class="text" x="970" y="428">cash + position * mid</text>
  <text class="text" x="970" y="448">fee model applied</text>

  <!-- Arrows -->
  <path class="arrow" d="M300 105 L370 105 L370 200" />
  <path class="arrow" d="M170 150 L170 200" />
  <path class="arrow" d="M170 310 L170 360" />
  <path class="arrow" d="M300 245 L370 245" />
  <path class="arrow" d="M590 245 L660 245" />
  <path class="arrow" d="M790 290 L790 330" />
  <path class="arrow" d="M920 245 L950 245" />
  <path class="arrow" d="M920 385 L950 385" />

  <!-- Data read arrows -->
  <path class="arrow dash" d="M920 385 L920 230" />
  <text class="text" x="905" y="320">read book</text>

  <path class="arrow dash" d="M300 245 L950 245" />
  <text class="text" x="520" y="230">current_time()</text>

  <!-- Labels -->
  <text class="text" x="40" y="30">Current Scheduling Flow (Backtest / Replay)</text>
</svg>
